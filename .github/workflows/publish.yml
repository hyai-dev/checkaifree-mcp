name: Publish to npm

# Publishes the package when a GitHub Release is published.
# Uses npm trusted publishing configured on npmjs.com for repo hyai-dev/checkaifree-mcp,
# workflow file publish.yml. No token needed.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Require release tag to match package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${RELEASE_TAG#v}"
          if [ "$tag" != "$pkg_version" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${pkg_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify npm version
        run: npm --version

      - name: Publish to npm
        run: npm publish --access public
